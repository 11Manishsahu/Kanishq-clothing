<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanishq Clothing | Shirts, Jackets, Scarves & Belts in Guna</title>
<meta name="description" content="Well-cut shirts, jackets, scarves and belts from Sadar Bazar, Guna. Order online or call us.">
<script>
(function(){try{var m=localStorage.getItem('kc-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=m}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
:root{
  --bg:#F5F6F8; --surface:#fff; --text:#151B3B; --muted:#586080; --line:#DDE0E8;
  --accent:#26307A; --gold:#F2A93B; --red:#B23A2E;
  --btn:#151B3B; --btn-hover:#26307A; --btn-text:#fff;
  --band:#151B3B; --foot:#0E1230; --pic:#E7E9F0; --header:rgba(245,246,248,.88);
  --head:'Bricolage Grotesque','Noto Sans Devanagari',system-ui,sans-serif; --body:'DM Sans','Noto Sans Devanagari',system-ui,sans-serif;
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#0F1226; --surface:#181C3A; --text:#EEF0FA; --muted:#A3A9C9; --line:#2B3060;
  --accent:#8F9BFF; --red:#FF7A6B;
  --btn:#2E3A9A; --btn-hover:#4452C4;
  --band:#080A1C; --foot:#05061A; --pic:#232852; --header:rgba(15,18,38,.88);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{font-family:var(--body);background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden;transition:background .3s,color .3s}
img{display:block;max-width:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 1.5rem}

header{position:sticky;top:0;z-index:900;background:var(--header);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{font-family:var(--head);font-weight:800;font-size:1.5rem;text-decoration:none;letter-spacing:-.02em}
.logo span{color:var(--gold)}
.nav-links{display:flex;align-items:center;gap:1.6rem}
.nav-links a{text-decoration:none;font-weight:500;font-size:.98rem}
.nav-links a:hover{color:var(--accent)}
.cart-pill{display:inline-flex;align-items:center;gap:.5rem;background:var(--btn);color:var(--btn-text);padding:.5rem 1.1rem;border-radius:99px;border:0;font:inherit;font-weight:500;cursor:pointer}
.cart-pill:hover{background:var(--btn-hover)}
.theme{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;font-size:1rem}
.theme:hover{border-color:var(--gold)}
.theme .sun{display:none}
[data-theme=dark] .theme .sun{display:inline}
[data-theme=dark] .theme .moon{display:none}
.hamburger{display:none;background:none;border:0;font-size:1.6rem;cursor:pointer;color:var(--text)}

.hero{padding:4rem 0 5rem}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:3rem;align-items:center}
.hero-copy{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.hero h1{font-family:var(--head);font-weight:800;font-size:clamp(2.8rem,7vw,5.6rem);line-height:.98;letter-spacing:-.035em;margin-bottom:1.5rem}
.hero p{font-size:1.2rem;color:var(--muted);max-width:30em;margin-bottom:2rem}
.btns{display:flex;flex-wrap:wrap;gap:.9rem}
.btn{display:inline-block;font:inherit;font-weight:700;text-decoration:none;cursor:pointer;border:2px solid var(--text);padding:.9rem 1.8rem;border-radius:99px;transition:transform .2s,background .2s,color .2s}
.btn-main{background:var(--gold);border-color:var(--gold);color:#151B3B}
.btn-main:hover{transform:translateY(-2px);background:#ffbf5c}
.btn-line{background:transparent;color:var(--text)}
.btn-line:hover{background:var(--text);color:var(--bg)}
.arch{border-radius:999px 999px 18px 18px;overflow:hidden;aspect-ratio:4/5;background:var(--accent);box-shadow:14px 14px 0 var(--gold)}
.arch img{width:100%;height:100%;object-fit:cover}

.about{padding:4rem 0;border-top:1px solid var(--line)}
.about .wrap{display:grid;grid-template-columns:.8fr 1.2fr;gap:3rem}
h2{font-family:var(--head);font-weight:800;font-size:clamp(2rem,4.5vw,3rem);line-height:1.05;letter-spacing:-.025em}
.about p{color:var(--muted);font-size:1.08rem;margin-bottom:1rem;max-width:40em}
.about p:last-child{color:var(--text);font-weight:500}

.shop{padding:4rem 0 5rem}
.shop-head{display:flex;justify-content:space-between;align-items:end;gap:1rem;margin-bottom:2rem;flex-wrap:wrap}
.shop-head p{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.25rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;position:relative;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(0,0,0,.16)}
.card .pic{aspect-ratio:4/5;background:var(--pic);overflow:hidden}
.card .pic img{width:100%;height:100%;object-fit:cover}
.info{padding:1rem 1.1rem 1.2rem;display:flex;flex-direction:column;gap:.35rem;flex:1}
.card h3{font-family:var(--head);font-size:1.15rem;font-weight:700;line-height:1.2}
.price{font-weight:700;font-size:1.1rem}
.card .add{margin-top:auto;font:inherit;font-weight:700;background:var(--btn);color:var(--btn-text);border:0;border-radius:10px;padding:.75rem;cursor:pointer;transition:background .2s}
.card .add:hover{background:var(--btn-hover)}
.tag{position:absolute;top:12px;left:12px;z-index:3;background:var(--gold);color:#151B3B;font-size:.78rem;font-weight:700;padding:.2rem .7rem;border-radius:99px}
.tag.sale{background:#B23A2E;color:#fff}
.feature{grid-column:span 2;grid-row:span 2}
.feature .pic{aspect-ratio:auto;flex:1;min-height:340px;position:relative}
.slides img{position:absolute;inset:0;opacity:0;transition:opacity .4s}
.slides img.active{opacity:1}
.sbtn{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#151B3B;font-size:1.3rem;cursor:pointer;z-index:2}
.sbtn.prev{left:12px}.sbtn.next{right:12px}
.specs{list-style:none;color:var(--muted);font-size:.93rem;margin:.4rem 0 .8rem}
.specs li{padding:.28rem 0;border-bottom:1px solid var(--line)}
.specs li:last-child{border:0}
.specs strong{color:var(--text)}

.contact{background:var(--band);color:#fff;padding:4.5rem 0}
.contact .wrap{display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:center}
.contact p{color:#C8CCE0;margin-top:1rem;max-width:26em}
.reach{display:grid;gap:1.2rem}
.reach a,.reach div{display:block;text-decoration:none}
.reach small{display:block;color:#9AA0C0;font-size:.85rem}
.reach .big{font-family:var(--head);font-weight:700;font-size:clamp(1.5rem,3.5vw,2.2rem);color:var(--gold)}
.reach .big:hover{text-decoration:underline}
footer{background:var(--foot);color:#C8CCE0;padding:2rem 0}
footer .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem}
.social{display:flex;gap:.7rem}
.social a{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#1D2350;color:#fff;text-decoration:none;transition:background .2s}
.social a:hover{background:var(--gold);color:#151B3B}

.float{position:fixed;right:22px;bottom:22px;z-index:800;width:60px;height:60px;border-radius:50%;border:0;background:var(--gold);color:#151B3B;font-size:1.5rem;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.35);transition:transform .2s}
.float:hover{transform:scale(1.07)}
.count{position:absolute;top:-4px;right:-4px;min-width:24px;height:24px;padding:0 6px;border-radius:99px;background:#B23A2E;color:#fff;font-size:.8rem;font-weight:700;display:flex;align-items:center;justify-content:center}

/* Cart drawer */
.overlay{display:none;position:fixed;inset:0;background:rgba(5,6,26,.7);z-index:1000;justify-content:flex-end}
.overlay.open{display:flex}
.drawer{background:var(--surface);color:var(--text);width:100%;max-width:460px;height:100%;display:flex;flex-direction:column;animation:slide .3s ease}
@keyframes slide{from{transform:translateX(100%)}to{transform:none}}
.d-top{display:flex;justify-content:space-between;align-items:center;padding:1.3rem 1.5rem;border-bottom:1px solid var(--line)}
.d-top h2{font-size:1.6rem}
.d-top small{color:var(--muted);font-family:var(--body);font-size:.95rem;font-weight:400;letter-spacing:0}
.close{background:none;border:0;font-size:1.4rem;cursor:pointer;padding:.3rem .6rem;color:var(--text)}
.d-body{flex:1;overflow-y:auto;padding:0 1.5rem}
.empty{text-align:center;color:var(--muted);padding:3rem 0}
.item{padding:1rem 0;border-bottom:1px solid var(--line)}
.item-top{display:flex;justify-content:space-between;gap:1rem;align-items:start}
.item-name{font-weight:700}
.unit{color:var(--muted);font-size:.9rem}
.remove{background:none;border:0;cursor:pointer;color:var(--red);font-size:.9rem;padding:.2rem}
.item-bot{display:flex;justify-content:space-between;align-items:center;margin-top:.6rem}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{width:36px;height:36px;border:0;background:transparent;color:var(--text);font-size:1.15rem;cursor:pointer}
.qty button:hover{background:var(--bg)}
.qty b{min-width:34px;text-align:center}
.line{font-weight:700;font-size:1.05rem}
.d-foot{border-top:1px solid var(--line);padding:1.2rem 1.5rem 1.5rem;background:var(--surface)}
.sum{display:flex;justify-content:space-between;color:var(--muted);margin-bottom:.3rem}
.sum.total{color:var(--text);font-size:1.3rem;font-weight:800;margin-bottom:1rem}
.d-foot h3{font-family:var(--head);font-size:1rem;margin:.4rem 0 .6rem}
.d-foot input{width:100%;font:inherit;padding:.7rem .9rem;margin-bottom:.55rem;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
.d-foot input:focus{outline:none;border-color:var(--accent)}
.pay{width:100%;border:0;font:inherit;font-weight:700;padding:.95rem;border-radius:12px;cursor:pointer;margin-top:.4rem;display:block;text-align:center;text-decoration:none}
.pay.wa{background:#1FA855;color:#fff}
.pay.wa:hover{background:#188a45}
.pay.rzp{background:transparent;border:2px solid var(--line);color:var(--text)}
.pay.rzp:hover{border-color:var(--accent)}
.pay:disabled{opacity:.45;cursor:not-allowed}
.note{color:var(--muted);font-size:.82rem;margin-top:.6rem}
.done{text-align:center;padding:3rem 1.5rem}
.done h3{font-family:var(--head);font-size:1.6rem;margin-bottom:.6rem}
.done p{color:var(--muted);margin-bottom:1.2rem}

.link-btn{background:none;border:0;font:inherit;font-weight:500;font-size:.98rem;color:var(--text);cursor:pointer}
.link-btn:hover{color:var(--accent)}
.order{border:1.5px solid var(--line);border-radius:14px;padding:1rem;margin:1rem 0}
.o-top{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;margin-bottom:.5rem}
.o-id{font-weight:700}
.o-date{color:var(--muted);font-size:.88rem}
.o-line{display:flex;justify-content:space-between;gap:1rem;font-size:.95rem;padding:.15rem 0}
.o-bot{display:flex;justify-content:space-between;align-items:center;margin-top:.7rem;padding-top:.7rem;border-top:1px solid var(--line);gap:.6rem}
.chip{display:inline-block;font-size:.78rem;font-weight:700;padding:.2rem .65rem;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
.chip.paid{background:#1FA855;border-color:#1FA855;color:#fff}
.again{font:inherit;font-weight:700;border:2px solid var(--line);background:transparent;color:var(--text);padding:.45rem 1rem;border-radius:99px;cursor:pointer;margin-top:.7rem}
.again:hover{border-color:var(--accent)}
.clear{background:none;border:0;color:var(--red);cursor:pointer;font:inherit;font-size:.9rem;margin:.5rem 0 1.5rem}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,120px);background:var(--text);color:var(--bg);padding:.8rem 1.4rem;border-radius:99px;z-index:2000;transition:transform .3s;font-weight:500;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}

@media(max-width:900px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .feature{grid-column:span 2;grid-row:auto}
  .feature .pic{min-height:380px}
  .hero .wrap,.about .wrap,.contact .wrap{grid-template-columns:1fr}
  .arch{max-width:380px;box-shadow:10px 10px 0 var(--gold)}
}
@media(max-width:720px){
  .drawer{overflow-y:auto;height:100dvh}
  .d-body{flex:none;overflow:visible;min-height:120px}
  .d-top{position:sticky;top:0;background:var(--surface);z-index:2}
  .hamburger{display:block}
  .bar-end{gap:.7rem}
  .lang{order:-1;padding:.55rem 1.05rem}
  .nav-links{display:none;position:absolute;top:68px;left:0;right:0;background:var(--bg);flex-direction:column;align-items:flex-start;gap:1rem;padding:1.2rem 1.5rem;border-bottom:1px solid var(--line)}
  .nav-links.active{display:flex}
  .hero{padding-top:2.5rem}
}
@media(max-width:480px){.grid{grid-template-columns:1fr}.feature{grid-column:auto}}
.card[hidden]{display:none}
.toolbar{display:flex;gap:1rem;flex-wrap:wrap;align-items:center;margin-bottom:1.5rem}
.toolbar input{flex:1;min-width:200px;font:inherit;padding:.7rem 1.1rem;border:1.5px solid var(--line);border-radius:99px;background:var(--surface);color:var(--text)}
.toolbar input:focus{outline:none;border-color:var(--accent)}
.chips{display:flex;gap:.5rem;flex-wrap:wrap}
.chip-b{font:inherit;font-weight:500;padding:.5rem 1.1rem;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
.chip-b.on{background:var(--btn);border-color:var(--btn);color:var(--btn-text)}
.nomatch{text-align:center;color:var(--muted);padding:3rem 0}
.opts{display:flex;gap:.5rem;margin:.3rem 0 .6rem}
.opts select{flex:1;min-width:0;font:inherit;padding:.5rem;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
.facts{padding:0 0 4.5rem}
.facts h2{margin-bottom:1.5rem}
.facts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.4rem}
.fact h3{font-family:var(--head);font-size:1.2rem;margin-bottom:.4rem}
.fact p{color:var(--muted)}
.dir{display:inline-block;margin-top:.5rem;color:var(--gold);font-weight:700}
.wa-float{position:fixed;left:22px;bottom:22px;z-index:800;display:flex;align-items:center;gap:.5rem;background:#1FA855;color:#fff;text-decoration:none;font-weight:700;padding:.85rem 1.2rem;border-radius:99px;box-shadow:0 8px 22px rgba(0,0,0,.3)}
.wa-float:hover{background:#188a45}
.wa-float i{font-size:1.4rem}
.vr{color:var(--muted);font-size:.88rem}
.bar-end{display:flex;align-items:center;gap:1.2rem}
.lang{display:inline-flex;align-items:center;gap:.5rem;background:var(--gold);color:#151B3B;border:0;border-radius:99px;padding:.65rem 1.3rem;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.18);transition:transform .15s,background .15s}
.lang:hover{background:#ffbf5c;transform:translateY(-1px)}
.desc{color:var(--muted);font-size:.93rem;margin:.1rem 0 .4rem}
html[lang=hi] h1,html[lang=hi] h2,html[lang=hi] h3{letter-spacing:0;line-height:1.25}
html[lang=hi] .hero h1{font-size:clamp(2.1rem,5.2vw,3.9rem)}
html[lang=hi] .hero p,html[lang=hi] .about p{line-height:1.8}
@media(max-width:900px){.facts-grid{grid-template-columns:1fr}}
@media(max-width:560px){.wa-float span{display:none}.wa-float{padding:.95rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a href="#home" class="logo">Kanishq<span>.</span></a>
    <div class="bar-end">
    <nav aria-label="Main">
      <button class="hamburger" onclick="toggleMenu()" aria-label="Menu">☰</button>
      <div class="nav-links" id="nav-links">
        <a href="#about" data-i="nav_about"></a>
        <a href="#products" data-i="nav_shop"></a>
        <a href="#contact" data-i="nav_contact"></a>
        <button class="link-btn" onclick="showOrders()" data-i="nav_orders"></button>
        <button class="theme" onclick="toggleTheme()" aria-label="Light or dark mode"><i class="fa-solid fa-moon moon"></i><i class="fa-solid fa-sun sun"></i></button>
        <button class="cart-pill" onclick="showCart()"><i class="fa-solid fa-bag-shopping"></i> <span data-i="cart"></span> (<span id="cart-count">0</span>)</button>
      </div>
    </nav>
    <button class="lang" id="lang-btn" onclick="toggleLang()" aria-label="Language / भाषा"></button>
    </div>
  </div>
</header>

<main id="home">
  <section class="hero">
    <div class="wrap">
      <div class="hero-copy">
        <h1 data-i="h1"></h1>
        <p data-i="hero_p"></p>
        <div class="btns">
          <a href="#products" class="btn btn-main" data-i="shop_btn"></a>
          <a href="tel:+91-9285247739" class="btn btn-line" data-i="call_btn"></a>
        </div>
      </div>
      <div class="arch"><img src="https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=900&q=80" alt="Kanishq Clothing"></div>
    </div>
  </section>

  <section class="about" id="about">
    <div class="wrap">
      <h2 data-i="about_h"></h2>
      <div><p data-i="about1"></p><p data-i="about2"></p><p data-i="about3"></p><p data-i="about4"></p></div>
    </div>
  </section>

  <section class="shop" id="products">
    <div class="wrap">
      <div class="shop-head"><h2 data-i="shop_h"></h2><p data-i="shop_p"></p></div>
      <div class="toolbar">
        <input type="search" id="q" data-ip="search" oninput="applyFilter()" aria-label="Search">
        <div class="chips" id="chips"></div>
      </div>
      <div class="grid" id="grid"></div>
      <p class="nomatch" id="none" data-i="none" hidden></p>
    </div>
  </section>

  <section class="facts">
    <div class="wrap">
      <h2 data-i="info_h"></h2>
      <div class="facts-grid">
        <div class="fact"><h3 data-i="i1_t"></h3><p data-i="i1_d"></p></div>
        <div class="fact"><h3 data-i="i2_t"></h3><p data-i="i2_d"></p></div>
        <div class="fact"><h3 data-i="i3_t"></h3><p data-i="i3_d"></p></div>
      </div>
    </div>
  </section>

  <section class="contact" id="contact">
    <div class="wrap">
      <div><h2 data-i="contact_h"></h2><p data-i="contact_p"></p></div>
      <div class="reach">
        <a href="tel:+91-9285247739" class="big"><small data-i="call"></small>+91-9285247739</a>
        <a href="mailto:manishsahujiguna@gmail.com"><small data-i="email"></small>support@kanishqclothing.com</a>
        <div><small data-i="visit"></small><span data-i="addr"></span><br><a class="dir" href="https://www.google.com/maps/search/?api=1&query=Kanishq+Clothing+Sadar+Bazar+Guna" target="_blank" rel="noopener"><i class="fa-solid fa-location-dot"></i> <span data-i="dir"></span></a></div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <p data-i="foot"></p>
    <div class="social">
      <a href="https://www.instagram.com/manish_sahu2003" target="_blank" rel="noopener" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
      <a href="https://www.twitter.com/" target="_blank" rel="noopener" aria-label="X"><i class="fab fa-x-twitter"></i></a>
      <a href="https://www.facebook.com/" target="_blank" rel="noopener" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
    </div>
  </div>
</footer>

let lang = 'en';
try { lang = localStorage.getItem('kc-lang') === 'hi' ? 'hi' : 'en'; } catch (e) {}
const t = k => D[k][lang === 'hi' ? 1 : 0];
const pname = id => PRODUCTS[id].name;
const cname = c => c;

const $ = id => document.getElementById(id);
const money = n => '₹' + n.toLocaleString('en-IN');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const keyOf = (id, size, color) => [id, size || '', color || ''].join('|');
let cart = {};                                    // { "id|size|color": quantity }
let view = '', cat = 'all';

try { const sv = JSON.parse(localStorage.getItem('kc-cart') || '{}');
  for (const k in sv) { const [id, sz, co] = k.split('|'), p = PRODUCTS[id];
    if (p && (!p.sizes || p.sizes.includes(sz)) && (!p.colors || p.colors.includes(co)) && Number.isInteger(sv[k]) && sv[k] > 0) cart[k] = Math.min(sv[k], 99); }
} catch (e) {}
const save = () => { try { localStorage.setItem('kc-cart', JSON.stringify(cart)); } catch (e) {} };

let orders = [];
try { orders = JSON.parse(localStorage.getItem('kc-orders') || '[]').filter(o => o && Array.isArray(o.items)); } catch (e) {}
const saveOrders = () => { try { localStorage.setItem('kc-orders', JSON.stringify(orders.slice(0, 50))); } catch (e) {} };
function saveProfile(d){ try { localStorage.setItem('kc-profile', JSON.stringify({ name:d.name, address:d.address, phone:d.phone, email:d.email })); } catch (e) {} }
function loadProfile(){ try { return JSON.parse(localStorage.getItem('kc-profile') || '{}'); } catch (e) { return {}; } }

const lines = () => Object.keys(cart).map(key => { const [id, size, color] = key.split('|'), p = PRODUCTS[id];
  return { key, id, size, color, name:p.name, price:p.price, qty:cart[key], sub:p.price * cart[key], variant:[size, color].filter(Boolean).join(', ') }; });
const itemCount = () => lines().reduce((s, l) => s + l.qty, 0);
const cartTotal = () => lines().reduce((s, l) => s + l.sub, 0);
const vlabel = (size, color) => [size, color && cname(color)].filter(Boolean).join(' · ');
function recordOrder(via, payId){
  const o = { id:'KC' + Date.now().toString(36).toUpperCase(), date:new Date().toISOString(),
    items:lines().map(l => ({ id:l.id, name:l.name, size:l.size, color:l.color, price:l.price, qty:l.qty })), total:cartTotal(), via, payId:payId || '' };
  orders.unshift(o); saveOrders(); return o;
}

function toast(msg){ const e = $('toast'); e.textContent = msg; e.classList.add('show'); clearTimeout(toast.id); toast.id = setTimeout(() => e.classList.remove('show'), 1900); }
function refreshBadges(){ const n = itemCount(); $('cart-count').textContent = n; $('floating-cart-count').textContent = n; }
const isOpen = () => $('cart-overlay').classList.contains('open');

/* ---- Products, search and categories ---- */
const sel = (id, label, list) => `<select id="${id}" aria-label="${label}"><option value="">${label}</option>${list.map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select>`;
function cardHTML(id){
  const p = PRODUCTS[id], f = !!p.feature, nm = pname(id);
  const pic = f ? `<div class="pic slides">${p.imgs.map((src, i) => `<img src="${src}" alt="${nm}" ${i ? '' : 'class="active"'}>`).join('')}<button class="sbtn prev" onclick="slide(this,-1)" aria-label="Previous">‹</button><button class="sbtn next" onclick="slide(this,1)" aria-label="Next">›</button></div>`
                : `<div class="pic"><img src="${p.imgs[0]}" alt="${nm}" loading="lazy"></div>`;
  const opts = (p.sizes ? sel('sz-' + id, t('size'), p.sizes.map(v => [v, v])) : '') + (p.colors ? sel('co-' + id, t('color'), p.colors.map(v => [v, cname(v)])) : '');
  return `<article class="card${f ? ' feature' : ''}" data-id="${id}"><span class="tag ${p.tag === 'sale' ? 'sale' : ''}">${t('tag_' + p.tag)}</span>${pic}
    <div class="info"><h3>${nm}</h3><p class="desc">${p.desc[lang === 'hi' ? 1 : 0]}</p><div class="price">${money(p.price)}</div>
    ${opts ? `<div class="opts">${opts}</div>` : ''}<button class="add" onclick="addToCart('${id}')">${t('add')}</button></div></article>`;
}
function renderProducts(){ $('grid').innerHTML = Object.keys(PRODUCTS).map(cardHTML).join(''); }
function renderChips(){ $('chips').innerHTML = ['all','shirts','jackets','accessories','new'].map(c => `<button class="chip-b ${c === cat ? 'on' : ''}" onclick="setCat('${c}')">${t(c === 'all' ? 'all' : 'c_' + c)}</button>`).join(''); }
function setCat(c){ cat = c; renderChips(); applyFilter(); }
function applyFilter(){
  const q = $('q').value.trim().toLowerCase(); let shown = 0;
  document.querySelectorAll('#grid .card').forEach(c => { const p = PRODUCTS[c.dataset.id];
    const ok = (cat === 'all' || (cat === 'new' ? p.tag === 'new' : p.cat === cat)) && (!q || (p.name + ' ' + p.desc.join(' ')).toLowerCase().includes(q));
    c.hidden = !ok; if (ok) shown++; });
  $('none').hidden = shown > 0;
}

/* ---- Cart ---- */
function addToCart(id){
  const p = PRODUCTS[id], size = p.sizes ? $('sz-' + id).value : '', color = p.colors ? $('co-' + id).value : '';
  if (p.sizes && !size) return toast(t('pick_size'));
  if (p.colors && !color) return toast(t('pick_color'));
  const k = keyOf(id, size, color);
  cart[k] = Math.min((cart[k] || 0) + 1, 99); save(); refreshBadges();
  toast(pname(id) + ' ' + t('added')); if (isOpen() && view === 'cart') renderCart();
}
function changeQty(k, d){ cart[k] = Math.max(1, Math.min(99, (cart[k] || 1) + d)); save(); refreshBadges(); renderCart(); }
function removeItem(k){ delete cart[k]; save(); refreshBadges(); renderCart(); }

function renderCart(){
  view = 'cart';
  const keep = {}; ['name','address','email','phone'].forEach(f => { const el = $('c-' + f); if (el) keep[f] = el.value; });
  const L = lines(), n = itemCount(), has = L.length > 0;
  $('drawer').innerHTML = `
    <div class="d-top"><h2>${t('your_cart')} <small>${n} ${t(n === 1 ? 'item' : 'items')}</small></h2><button class="close" onclick="hideCart()" aria-label="Close">✕</button></div>
    <div class="d-body">${has ? L.map(l => `
      <div class="item">
        <div class="item-top">
          <div><div class="item-name">${pname(l.id)}</div>${l.variant ? `<div class="vr">${vlabel(l.size, l.color)}</div>` : ''}<div class="unit">${money(l.price)} ${t('each')}</div></div>
          <button class="remove" onclick="removeItem('${l.key}')"><i class="fa-solid fa-trash"></i> ${t('remove')}</button>
        </div>
        <div class="item-bot">
          <div class="qty"><button onclick="changeQty('${l.key}',-1)" aria-label="-">–</button><b>${l.qty}</b><button onclick="changeQty('${l.key}',1)" aria-label="+">+</button></div>
          <div class="line">${l.qty} × ${money(l.price)} = ${money(l.sub)}</div>
        </div>
      </div>`).join('') : `<p class="empty">${t('empty_cart')}</p>`}</div>
    <div class="d-foot">
      <div class="sum"><span>${t('items_l')}</span><span>${n}</span></div>
      <div class="sum total"><span>${t('total')}</span><span>${money(cartTotal())}</span></div>
      <h3>${t('del_h')}</h3>
      <input id="c-name" placeholder="${t('ph_name')}" autocomplete="name">
      <input id="c-address" placeholder="${t('ph_addr')}" autocomplete="street-address">
      <input id="c-phone" type="tel" placeholder="${t('ph_phone')}" autocomplete="tel">
      <input id="c-email" type="email" placeholder="${t('ph_email')}" autocomplete="email">
      <button class="pay wa" onclick="orderWhatsApp()" ${has ? '' : 'disabled'}><i class="fab fa-whatsapp"></i> ${t('order_wa')}</button>
      <button class="pay rzp" onclick="payOnline()" ${has ? '' : 'disabled'}>${t('pay_rzp')}</button>
      <p class="note">${t('cart_note')}</p>
    </div>`;
  for (const f in keep) $('c-' + f).value = keep[f];
  if (!Object.keys(keep).length) { const p = loadProfile(); ['name','address','phone','email'].forEach(f => { if (p[f]) $('c-' + f).value = p[f]; }); }
}
function showCart(){ renderCart(); $('cart-overlay').classList.add('open'); document.body.style.overflow = 'hidden'; }
function hideCart(){ view = ''; $('cart-overlay').classList.remove('open'); document.body.style.overflow = ''; }

/* ---- Order history ---- */
function showOrders(){
  view = 'orders';
  const fmt = iso => new Date(iso).toLocaleString(lang === 'hi' ? 'hi-IN' : 'en-IN', { day:'numeric', month:'short', year:'numeric', hour:'numeric', minute:'2-digit' });
  $('drawer').innerHTML = `
    <div class="d-top"><h2>${t('my_orders')} <small>${orders.length}</small></h2><button class="close" onclick="hideCart()" aria-label="Close">✕</button></div>
    <div class="d-body">${orders.length ? orders.map((o, i) => `
      <div class="order">
        <div class="o-top"><span class="o-id">${esc(o.id)}</span><span class="o-date">${fmt(o.date)}</span></div>
        ${o.items.map(it => `<div class="o-line"><span>${it.qty} × ${PRODUCTS[it.id] ? pname(it.id) : esc(it.name)}${it.size || it.color ? ` <span class="vr">(${esc(vlabel(it.size, it.color))})</span>` : ''}</span><span>${money(it.price * it.qty)}</span></div>`).join('')}
        <div class="o-bot"><div><span class="chip ${o.via === 'razorpay' ? 'paid' : ''}">${t(o.via === 'razorpay' ? 'st_paid' : 'st_wa')}</span>${o.payId ? `<div class="o-date">${t('pay_id')}: ${esc(o.payId)}</div>` : ''}</div><b>${money(o.total)}</b></div>
        <button class="again" onclick="reorder(${i})">${t('again')}</button>
      </div>`).join('') + `<button class="clear" onclick="clearOrders()">${t('clear')}</button>` : `<p class="empty">${t('no_orders')}</p>`}</div>
    <div class="d-foot"><p class="note">${t('hist_note')}</p></div>`;
  $('cart-overlay').classList.add('open'); document.body.style.overflow = 'hidden';
}
function reorder(i){
  const o = orders[i]; if (!o) return;
  o.items.forEach(it => { if (!PRODUCTS[it.id]) return; const k = keyOf(it.id, it.size, it.color); cart[k] = Math.min((cart[k] || 0) + it.qty, 99); });
  save(); refreshBadges(); showCart(); toast(t('reordered'));
}
function clearOrders(){ if (confirm(t('clear_q'))) { orders = []; saveOrders(); showOrders(); } }

/* ---- Checkout ---- */
function details(){
  const d = { name:$('c-name').value.trim(), address:$('c-address').value.trim(), phone:$('c-phone').value.replace(/[\s-]/g, ''), email:$('c-email').value.trim() };
  if (!d.name || !d.address || !d.phone) { toast(t('fill')); return null; }
  if (!/^(\+?91)?[6-9]\d{9}$/.test(d.phone)) { toast(t('badphone')); return null; }
  return d;
}
function orderText(d, payId){
  return `New order from Kanishq website\n\n` +
    lines().map((l, i) => `${i + 1}. ${l.name}${l.variant ? ' (' + l.variant + ')' : ''}: ${l.qty} × ${money(l.price)} = ${money(l.sub)}`).join('\n') +
    `\n\nItems: ${itemCount()}\nTotal: ${money(cartTotal())}\n` + (payId ? `Paid online. Payment ID: ${payId}\n` : '') +
    `\nName: ${d.name}\nPhone: ${d.phone}\nAddress: ${d.address}` + (d.email ? `\nEmail: ${d.email}` : '');
}
const waLink = text => `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(text)}`;
const doneScreen = (title, body) => { view = 'done'; $('drawer').innerHTML = `<div class="d-top"><h2>${title}</h2><button class="close" onclick="hideCart()" aria-label="Close">✕</button></div><div class="done">${body}</div>`; };

function orderWhatsApp(){
  if (!itemCount()) return toast(t('empty_t'));
  const d = details(); if (!d) return;
  recordOrder('whatsapp'); saveProfile(d);
  window.open(waLink(orderText(d)), '_blank', 'noopener');
  cart = {}; save(); refreshBadges();
  doneScreen(t('started'), `<h3>${t('one_last')}</h3><p>${t('wa_open')}</p><button class="pay wa" onclick="hideCart()">${t('done')}</button><button class="pay rzp" onclick="showOrders()">${t('view_orders')}</button>`);
}
function payOnline(){
  if (!itemCount()) return toast(t('empty_t'));
  const d = details(); if (!d) return;
  const amount = cartTotal(), summary = lines().map(l => `${l.name}${l.variant ? ' (' + l.variant + ')' : ''} x${l.qty}`).join(', ');
  new Razorpay({
    key:RAZORPAY_KEY, amount:amount * 100, currency:"INR", name:"Kanishq Clothing",
    description:`${itemCount()} item(s): ${summary}`.slice(0, 250),
    prefill:{ name:d.name, email:d.email, contact:d.phone },
    notes:{ address:d.address.slice(0, 250), items:summary.slice(0, 250), total:String(amount) },
    handler: r => {
      const text = orderText(d, r.razorpay_payment_id), link = waLink(text);
      recordOrder('razorpay', r.razorpay_payment_id); saveProfile(d);
      cart = {}; save(); refreshBadges();
      doneScreen(t('pay_ok'), `<h3>${t('thanks')}, ${esc(d.name.split(' ')[0])}!</h3><p>${t('pay_id')}: ${esc(r.razorpay_payment_id)}<br>${t('send_det')}</p>
        <a class="pay wa" href="${link}" target="_blank" rel="noopener"><i class="fab fa-whatsapp"></i> ${t('send_wa')}</a><button class="pay rzp" onclick="showOrders()">${t('view_orders')}</button>`);
      window.open(link, '_blank', 'noopener');   // some phones block this; the button above is the backup
    },
    theme:{ color:"#26307A" }
  }).open();
}

/* ---- Language, theme, menu ---- */
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i]').forEach(e => e.innerHTML = t(e.dataset.i));
  document.querySelectorAll('[data-ip]').forEach(e => e.placeholder = t(e.dataset.ip));
  $('lang-btn').innerHTML = '<i class="fa-solid fa-language"></i> ' + (lang === 'hi' ? 'English' : 'हिन्दी');
  renderProducts(); renderChips(); applyFilter();
  if (isOpen()) { if (view === 'cart') renderCart(); else if (view === 'orders') showOrders(); }
}
function toggleLang(){ lang = lang === 'hi' ? 'en' : 'hi'; try { localStorage.setItem('kc-lang', lang); } catch (e) {} applyLang(); }
function toggleTheme(){
  const th = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = th; try { localStorage.setItem('kc-theme', th); } catch (e) {}
}
function toggleMenu(){ $('nav-links').classList.toggle('active'); }
document.querySelectorAll('.nav-links a').forEach(a => a.addEventListener('click', () => $('nav-links').classList.remove('active')));
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideCart(); });
function slide(btn, dir){
  const imgs = [...btn.parentElement.querySelectorAll('img')], a = imgs.findIndex(i => i.classList.contains('active'));
  imgs[a].classList.remove('active'); imgs[(a + dir + imgs.length) % imgs.length].classList.add('active');
}

$('wa-chat').href = waLink('Hi Kanishq Clothing, I have a question.');
refreshBadges();
applyLang();
</script>
</body>
</html>
